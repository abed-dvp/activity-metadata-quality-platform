version: review_routing_v2
status: phase6_lane_specific_validated_candidate
production_enabled: false
category: museum

review_queue:
  high_confidence_conflict_threshold: 0.90
  include_uncertain: true
  include_label_conflicts: true
  include_provider_errors: true

candidate_routing:
  member_threshold: 0.98
  not_member_threshold: 0.98
  thresholds_independently_validated: true
  uncertain_route: HUMAN_REVIEW
  provider_error_route: HUMAN_REVIEW

member_lane_validation:
  reference: representative_holdout
  threshold: 0.98
  auto_member_rows: 6
  public_reference_errors: 0
  assisted_candidate_errors: 0

not_member_lane_validation:
  representative_reference_errors_at_0_98: 0
  positive_sensitivity_auto_rejects_at_0_98: 0
  threshold: 0.98

cost_sensitivity:
  units: normalized_not_currency
  unconstrained_member_threshold: 0.98
  unconstrained_not_member_threshold: 0.80
  safety_constraint_overrides_cost_optimum: true
  safety_reason: >-
    Lower not-member thresholds auto-reject public-positive sensitivity cases
    that do not yet have independent human-gold adjudication.

notes:
  - Production routing remains disabled.
  - Assisted adjudication is not represented as independent human gold.
  - Member and not-member thresholds may diverge in future categories.
  - Every category must pass its own calibration, holdout, and lane validation.
