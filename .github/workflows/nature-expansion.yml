name: Nature category expansion

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/nature-trigger.txt"

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest -q

      - name: Check Gemini credential
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is required"
            exit 1
          fi

      - name: Download London data
        run: python -m src.data.download_london

      - name: Build Phase 1 and Phase 2
        run: |
          python -m src.data.run_phase1
          python -m src.evaluation.run_phase2

      - name: Run nature semantic calibration
        run: |
          python -m src.semantic.run_phase3 \
            --category nature \
            --sample-size 240 \
            --model gemini-3.8-flash \
            --max-workers 2 \
            --max-workers 2

      - name: Save calibration summary
        run: |
          mkdir -p reports/categories/nature/phase3
          cp data/processed/semantic_nature_v1_summary.json reports/categories/nature/phase3/
          cp data/processed/semantic_nature_v1_disagreements.csv reports/categories/nature/phase3/

      - name: Run independent nature holdout
        run: |
          python -m src.evaluation.run_phase5 \
            --category nature \
            --representative-size 600 \
            --model gemini-3.8-flash

      - name: Upload nature artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nature-category-expansion
          path: |
            data/processed/semantic_nature_v1_calibration.csv
            data/processed/semantic_nature_v1_disagreements.csv
            data/processed/semantic_nature_v1_summary.json
            data/processed/nature_phase5_holdout_evaluated.csv
            data/processed/nature_phase5_representative.csv
            data/processed/nature_phase5_positive_diagnostic.csv
            reports/categories/nature/phase3/
            reports/categories/nature/phase5/
          retention-days: 30

      - name: Commit compact nature reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/categories/nature
          if git diff --cached --quiet; then
            echo "No nature report changes."
          else
            git commit -m "eval: add nature category expansion results"
            git fetch origin main
            git rebase origin/main
            git push
          fi
