name: Location review queue

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/location-review-trigger.txt'

permissions:
  contents: write

jobs:
  review-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: python -m src.review.build_location_review_queue
      - name: Commit review queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/location/semantic/location_review_queue.csv reports/location/semantic/location_review_summary.json
          if ! git diff --cached --quiet; then
            git commit -m "review: add prioritized location anomaly queue"
            git fetch origin main
            git rebase origin/main
            git push
          fi
