name: Closed-loop feedback

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/closed-loop-trigger.txt'

permissions:
  contents: write

jobs:
  feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Build learning events and regression set
        run: python -m src.evaluation.run_closed_loop_feedback
      - name: Commit closed-loop reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/feedback/learning_events.csv reports/feedback/closed_loop_regression_cases.csv reports/feedback/closed_loop_summary.json
          if ! git diff --cached --quiet; then
            git commit -m "feedback: add closed-loop learning artifacts"
            git fetch origin main
            git rebase origin/main
            git push
          fi
