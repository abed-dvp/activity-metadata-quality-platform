name: Semantic category calibration

on:
  workflow_dispatch:
    inputs:
      category:
        description: Category to evaluate atomically
        required: true
        default: museum
        type: string
      sample_size:
        description: Maximum calibration rows
        required: true
        default: "240"
        type: string
      model:
        description: Google Gemini model
        required: true
        default: gemini-3.8-flash
        type: string
  push:
    branches: [main]
    paths:
      - ".github/semantic-trigger.txt"
      - "src/semantic/**"

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CATEGORY: ${{ inputs.category || 'museum' }}
      SAMPLE_SIZE: ${{ inputs.sample_size || '240' }}
      MODEL: ${{ inputs.model || 'gemini-3.8-flash' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest -q

      - name: Check Gemini API credential
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY GitHub Actions secret is required for semantic calibration."
            exit 1
          fi

      - name: Download official London dataset
        run: python -m src.data.download_london

      - name: Build real evaluation set and deterministic baseline
        run: |
          python -m src.data.run_phase1
          python -m src.evaluation.run_phase2

      - name: Run atomic Gemini semantic evaluator
        run: |
          python -m src.semantic.run_phase3 \
            --category "$CATEGORY" \
            --sample-size "$SAMPLE_SIZE" \
            --model "$MODEL"

      - name: Prepare report
        run: |
          mkdir -p reports/phase3
          cp "data/processed/semantic_${CATEGORY}_v1_summary.json" reports/phase3/

      - name: Upload full calibration artifact
        uses: actions/upload-artifact@v4
        with:
          name: semantic-${{ env.CATEGORY }}-calibration
          path: |
            data/processed/semantic_${{ env.CATEGORY }}_v1_calibration.csv
            data/processed/semantic_${{ env.CATEGORY }}_v1_disagreements.csv
            data/processed/semantic_${{ env.CATEGORY }}_v1_summary.json
          retention-days: 30

      - name: Commit summary report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/phase3
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "eval: add Gemini semantic ${CATEGORY} calibration results"
            git push
          fi
