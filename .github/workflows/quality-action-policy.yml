name: Quality action policy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/quality-action-trigger.txt'

permissions:
  contents: write

jobs:
  action-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Build action queue
        run: python -m src.evaluation.run_quality_action_policy
      - name: Commit action reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/impact/quality_action_queue.csv reports/impact/quality_action_summary.json
          if ! git diff --cached --quiet; then
            git commit -m "policy: add unified quality action queue"
            git fetch origin main
            git rebase origin/main
            git push
          fi
