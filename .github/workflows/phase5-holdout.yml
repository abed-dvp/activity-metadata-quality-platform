name: Phase 5 representative holdout

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/phase5-trigger.txt"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest -q

      - name: Check Gemini credential
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is required"
            exit 1
          fi

      - name: Download London data
        run: python -m src.data.download_london

      - name: Build Phase 1 and Phase 2
        run: |
          python -m src.data.run_phase1
          python -m src.evaluation.run_phase2

      - name: Recreate frozen Phase 3 calibration artifact
        run: |
          python -m src.semantic.run_phase3             --category museum             --sample-size 240             --model gemini-3.8-flash

      - name: Run Phase 5 holdout
        run: |
          python -m src.evaluation.run_phase5             --category museum             --representative-size 600             --model gemini-3.8-flash

      - name: Upload holdout artifacts
        uses: actions/upload-artifact@v4
        with:
          name: museum-phase5-holdout
          path: |
            data/processed/museum_phase5_holdout_evaluated.csv
            data/processed/museum_phase5_representative.csv
            data/processed/museum_phase5_positive_diagnostic.csv
            reports/phase5/holdout_summary.json
            reports/phase5/routing_threshold_sweep_holdout.csv
          retention-days: 30

      - name: Commit compact reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/phase5
          if git diff --cached --quiet; then
            echo "No report changes."
          else
            git commit -m "eval: add representative museum holdout results"
            git push
          fi
